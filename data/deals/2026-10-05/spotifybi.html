  <div class="bg-white rounded-xl shadow-card p-6">
    <h1 class="text-2xl font-bold text-gray-900 mb-1">Spotify bi</h1>
    
    <div class="flex gap-2 mb-4"><span class="bg-indigo-50 text-indigo-600 text-xs px-2 py-0.5 rounded-full">AI</span></div>

  </div>

      <th class="py-2 px-3 text-left">金额</th><th class="py-2 px-3 text-left">投资方</th>
    </tr></thead><tbody><tr class="border-b border-gray-100"><td class="py-2 px-3 text-sm font-medium">不适用（内部部门，非独立融资实体）</td><td class="py-2 px-3 text-sm text-gray-500">2006.04</td><td class="py-2 px-3 text-sm font-semibold">不适用</td><td class="py-2 px-3 text-sm text-gray-500">不适用</td></tr></tbody></table>
